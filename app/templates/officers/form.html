{% extends "base.html" %}

{% block title %}Add Officer - Police Roster System{% endblock %}

{% block content %}
<div class="app-header">
    <h1 class="app-title"><i class="fa-solid fa-user-plus text-navy me-2"></i> Register New Officer</h1>
    <p class="app-subtitle">Create a personnel record and optional login account</p>
</div>

<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4 bg-white">
                <form method="POST" action="{{ url_for('admin.add_officer') }}">
                    <div class="row g-3 mb-3">
                        <div class="col-md-4">
                            <label for="badge_number" class="form-label font-weight-bold">Badge Number *</label>
                            <input type="text" class="form-control" id="badge_number" name="badge_number" placeholder="e.g. O009" required>
                        </div>
                        <div class="col-md-4">
                            <label for="first_name" class="form-label font-weight-bold">First Name *</label>
                            <input type="text" class="form-control" id="first_name" name="first_name" placeholder="First Name" required>
                        </div>
                        <div class="col-md-4">
                            <label for="last_name" class="form-label font-weight-bold">Last Name *</label>
                            <input type="text" class="form-control" id="last_name" name="last_name" placeholder="Last Name" required>
                        </div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label for="rank" class="form-label font-weight-bold">Rank</label>
                            <select class="form-select" id="rank" name="rank">
                                <option value="Constable">Constable</option>
                                <option value="Senior Constable">Senior Constable</option>
                                <option value="Sergeant">Sergeant</option>
                                <option value="Inspector">Inspector</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="department_id" class="form-label font-weight-bold">Station / Precinct *</label>
                            <select class="form-select" id="department_id" name="department_id" required>
                                <option value="">-- Select Precinct --</option>
                                {% for d in departments %}
                                <option value="{{ d.id }}">{{ d.name }} ({{ d.code }})</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label for="phone" class="form-label font-weight-bold">Phone Contact</label>
                            <input type="text" class="form-control" id="phone" name="phone" placeholder="e.g. 555-0109">
                        </div>
                        <div class="col-md-6">
                            <label for="email" class="form-label font-weight-bold">Email Address</label>
                            <input type="email" class="form-control" id="email" name="email" placeholder="e.g. officer@police.gov">
                        </div>
                    </div>

                    <div class="border-top pt-3 mt-4">
                        <div class="form-check mb-3">
                            <input class="form-check-input" type="checkbox" id="create_user_account" name="create_user_account" checked>
                            <label class="form-check-label font-weight-bold" for="create_user_account">
                                Automatically create user login account (Default password: <code>officer123</code>)
                            </label>
                        </div>

                        <div class="mb-3 col-md-6">
                            <label for="user_role" class="form-label font-weight-bold">Account User Role</label>
                            <select class="form-select" id="user_role" name="user_role">
                                <option value="OFFICER">Police Officer</option>
                                <option value="SUPERVISOR">Supervisor / Station Head</option>
                                <option value="ADMIN">Administrator</option>
                            </select>
                        </div>
                    </div>

                    <div class="d-flex justify-content-end gap-2 mt-4">
                        <a href="{{ url_for('admin.officers_list') }}" class="btn btn-outline-secondary">Cancel</a>
                        <button type="submit" class="btn btn-police-primary"><i class="fa-solid fa-check me-1"></i> Register Officer</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
