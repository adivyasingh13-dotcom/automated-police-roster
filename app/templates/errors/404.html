{% extends "base.html" %}
{% block title %}404 Page Not Found{% endblock %}
{% block content %}
<div class="text-center py-5">
    <h1 class="display-4 text-warning"><i class="fa-solid fa-triangle-exclamation me-2"></i> 404 Not Found</h1>
    <p class="lead text-secondary">The requested page or operational record could not be found.</p>
    <a href="{{ url_for('index') }}" class="btn btn-police-primary mt-3"><i class="fa-solid fa-house me-1"></i> Return to Home Dashboard</a>
</div>
{% endblock %}
