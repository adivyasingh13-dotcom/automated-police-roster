{% extends "base.html" %}
{% block title %}500 Internal Server Error{% endblock %}
{% block content %}
<div class="text-center py-5">
    <h1 class="display-4 text-danger"><i class="fa-solid fa-bug me-2"></i> 500 Internal Server Error</h1>
    <p class="lead text-secondary">An internal server error occurred while processing the request.</p>
    <a href="{{ url_for('index') }}" class="btn btn-police-primary mt-3"><i class="fa-solid fa-house me-1"></i> Return to Home Dashboard</a>
</div>
{% endblock %}
