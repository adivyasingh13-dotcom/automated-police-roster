{% extends "base.html" %}
{% block title %}403 Access Denied{% endblock %}
{% block content %}
<div class="text-center py-5">
    <h1 class="display-4 text-danger"><i class="fa-solid fa-lock me-2"></i> 403 Forbidden</h1>
    <p class="lead text-secondary">Access Denied: You do not have authorization to view this operational resource.</p>
    <a href="{{ url_for('index') }}" class="btn btn-police-primary mt-3"><i class="fa-solid fa-house me-1"></i> Return to Home Dashboard</a>
</div>
{% endblock %}
